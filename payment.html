<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <link rel="icon" href="images\secure checkout.avif">
    <style>
body {
    font-family: Arial;
    background: #f5f7fa;
    padding: 20px;
}
.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 30px;
}
.summary {
    border: 1px solid #ddd;
    padding: 20px;
    border-radius: 10px;
}
.summary-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
}
.total {
    font-size: 20px;
    font-weight: bold;
}
.pay-btn {
    width: 100%;
    padding: 15px;
    background: blue;
    color: white;
    border: none;
    margin-top: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div>
        <h2>Payment Method</h2>
        <p>UPI Selected (Demo)</p>
    </div>

    <!-- RIGHT (ORDER SUMMARY) -->
    <div class="summary">
        <h2>Order Summary</h2>

        <div class="summary-item">
            <span>Subtotal</span>
            <span id="subtotal">₹0</span>
        </div>

        <div class="summary-item">
            <span>Processing Fee</span>
            <span>₹20</span>
        </div>

        <div class="summary-item">
            <span>Discount</span>
            <span>-₹100</span>
        </div>

        <div class="summary-item total">
            <span>Total</span>
            <span id="total">₹0</span>
        </div>

        <button class="pay-btn" onclick="payNow()">Complete Payment</button>
    </div>

</div>

<script>
// ✅ LOAD CART & CALCULATE TOTAL
window.onload = function () {

    const cart = JSON.parse(localStorage.getItem("orderSummary")) || [];

    let subtotal = 0;

    cart.forEach(item => {
        subtotal += item.price * item.qty;
    });

    const processingFee = 20;
    const discount = 100;

    const finalTotal = subtotal + processingFee - discount;

    // ✅ Update UI
    document.getElementById("subtotal").textContent =
        "₹" + subtotal.toLocaleString("en-IN");

    document.getElementById("total").textContent =
        "₹" + finalTotal.toLocaleString("en-IN");

    // ✅ Store for payment
    localStorage.setItem("finalAmount", finalTotal);
};


// ✅ PAYMENT FUNCTION
function payNow() {

    const amount = localStorage.getItem("finalAmount") || 0;

    const orderId = "ORD" + Date.now();

    const message =
`🛒 *NEW ORDER*
💰 Amount: ₹${amount}
🆔 Order ID: ${orderId}`;

    const phone = "917092779050";

    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

    window.open(url, "_blank");
}
</script>

</body>
</html>
