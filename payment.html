<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <link rel="icon" href="images\secure checkout.avif">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body {
    font-family: Arial;
    background: #f5f7fa;
    padding: 20px;
}
.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 30px;
}
.summary {
    border: 1px solid #ddd;
    padding: 20px;
    border-radius: 10px;
}
.summary-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
}
.total {
    font-size: 20px;
    font-weight: bold;
}
.qr-box {
    text-align: center;
    margin-top: 20px;
}
.pay-btn {
    width: 100%;
    padding: 15px;
    background: blue;
    color: white;
    border: none;
    margin-top: 20px;
    cursor: pointer;
}
.method-btn {
    padding: 10px;
    margin-right: 10px;
    cursor: pointer;
}
.active {
    background: green;
    color: white;
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div>
        <h2>Select Payment</h2>

        <button class="method-btn active" onclick="selectMethod('upi')" id="upiBtn">UPI</button>
        <button class="method-btn" onclick="selectMethod('razorpay')" id="razorBtn">Razorpay</button>

        <div class="qr-box" id="qrBox">
            <h3>Scan & Pay</h3>
            <div id="qrCode"></div>
            <p id="upiText"></p>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="summary">
        <h2>Order Summary</h2>

        <div class="summary-item">
            <span>Subtotal</span>
            <span id="subtotal">₹0</span>
        </div>

        <div class="summary-item">
            <span>Processing Fee</span>
            <span>₹20</span>
        </div>

        <div class="summary-item">
            <span>Discount</span>
            <span>-₹100</span>
        </div>

        <div class="summary-item total">
            <span>Total</span>
            <span id="total">₹0</span>
        </div>

        <button class="pay-btn" onclick="payNow()">Complete Payment</button>
    </div>

</div>

<script>
let paymentMethod = "upi";
let finalAmount = 0;
let upiLink = "";

// ✅ LOAD CART & CALCULATE
window.onload = function () {

    const cart = JSON.parse(localStorage.getItem("orderSummary")) || [];

    let subtotal = 0;

    cart.forEach(item => {
        subtotal += item.price * item.qty;
    });

    const processingFee = 20;
    const discount = 100;

    finalAmount = subtotal + processingFee - discount;

    // UI update
    document.getElementById("subtotal").textContent =
        "₹" + subtotal.toLocaleString("en-IN");

    document.getElementById("total").textContent =
        "₹" + finalAmount.toLocaleString("en-IN");

    // UPI setup
    const upiId = "7092779050@axl";
    const name = "YourStore";

    upiLink = `upi://pay?pa=${upiId}&pn=${name}&am=${finalAmount}&cu=INR`;

    const qrUrl =
        `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiLink)}`;

    document.getElementById("qrCode").innerHTML =
        `<img src="${qrUrl}" width="180">`;

    document.getElementById("upiText").innerText =
        "UPI ID: " + upiId;
};

// ✅ SWITCH METHOD
function selectMethod(method) {
    paymentMethod = method;

    document.getElementById("upiBtn").classList.remove("active");
    document.getElementById("razorBtn").classList.remove("active");

    if (method === "upi") {
        document.getElementById("upiBtn").classList.add("active");
        document.getElementById("qrBox").style.display = "block";
    } else {
        document.getElementById("razorBtn").classList.add("active");
        document.getElementById("qrBox").style.display = "none";
    }
}

// ✅ PAYMENT HANDLER
function payNow() {

    if (paymentMethod === "upi") {

        if (/Android|iPhone/i.test(navigator.userAgent)) {
            window.location.href = upiLink;
        } else {
            alert("Scan QR using PhonePe / GPay");
        }

    } else {

        // Razorpay
        const options = {
            key: "rzp_test_XXXXXXXX", // 🔴 replace
            amount: finalAmount * 100,
            currency: "INR",
            name: "YourStore",
            description: "Order Payment",
            handler: function (response) {
                alert("Payment Successful ✅");

                localStorage.removeItem("cart");
                localStorage.removeItem("orderSummary");

                window.location.href = "success.html";
            },
            theme: { color: "#2563eb" }
        };

        const rzp = new Razorpay(options);
        rzp.open();
    }
}
</script>

</body>
</html>
