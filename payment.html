<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-light: #f8fafc;
            --border: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            line-height: 1.6;
        }
        .checkout-container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .checkout-header {
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            padding: 28px 40px;
            position: relative;
            overflow: hidden;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-title {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
        }
        .security-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(255,255,255,0.3);
        }
        .progress-fill {
            height: 100%;
            background: rgba(255,255,255,0.8);
            width: 85%;
            border-radius: 0 0 20px 20px;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 40px;
            padding: 40px;
        }
        .payment-section {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 24px;
        }
        .section-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0;
        }
        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .payment-option {
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: white;
        }
        .payment-option:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(37,99,235,0.12);
        }
        .payment-option.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            box-shadow: 0 10px 30px rgba(37,99,235,0.15);
        }
        .payment-radio {
            position: absolute;
            opacity: 0;
        }
        .radio-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 24px;
            height: 24px;
            border: 3px solid var(--primary);
            border-radius: 50%;
            background: white;
            opacity: 0;
            transition: all 0.3s;
        }
        .payment-option.active .radio-indicator {
            opacity: 1;
        }
        .payment-option.active .radio-indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
        }
        .payment-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
        }
        .payment-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0 0 4px 0;
        }
        .payment-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }
        /* Form Fields */
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
            transform: translateY(-1px);
        }
        .form-input.valid {
            border-color: var(--success);
            background: #f0fdf4;
        }
        .form-input.error {
            border-color: var(--danger);
            background: #fef2f2;
        }
        .card-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
        }
        .upi-qr {
            display: none;
            text-align: center;
            padding: 24px;
            background: var(--bg-light);
            border-radius: 16px;
            border: 3px dashed var(--primary);
            margin-top: 16px;
        }
        .upi-qr.active {
            display: block;
        }
        .qr-code {
            width: 160px;
            height: 160px;
            background: #ddd;
            border-radius: 12px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--text-muted);
        }
        .upi-id {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            word-break: break-all;
            margin-bottom: 8px;
        }
        /* Summary */
        .summary-card {
            background: white;
            border-radius: 20px;
            padding: 32px;
            border: 2px solid var(--border);
        }
        .summary-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }
        .amount-display {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--success), #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
        }
        .summary-item:last-child {
            border-bottom: none;
            font-weight: 700;
            font-size: 20px;
            color: var(--text-dark);
            padding-top: 24px;
        }
        .discount-tag {
            background: var(--success);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .pay-button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 24px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 24px;
            box-shadow: 0 15px 35px rgba(37,99,235,0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pay-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px rgba(37,99,235,0.4);
        }
        .pay-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        @media (max-width: 1024px) {
            .main-content { grid-template-columns: 1fr; gap: 32px; padding: 32px; }
        }
        @media (max-width: 480px) {
            .card-row { grid-template-columns: 1fr; gap: 12px; }
            body { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <div class="header-content">
                <div class="header-title">Secure Checkout</div>
                <div class="security-bar">
                    🔒 256-bit SSL | PCI DSS Compliant
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div class="main-content">
            <!-- Payment Methods -->
            <div class="payment-section">
                <div class="section-header">
                    <div class="section-icon">💳</div>
                    <h2 class="section-title">Payment Method</h2>
                </div>

                <div class="payment-grid">
                    <label class="payment-option" data-method="card">
                        <input type="radio" name="payment" class="payment-radio">
                        <div class="radio-indicator"></div>
                        <div class="payment-icon" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white;">💳</div>
                        <h3 class="payment-title">Credit / Debit Card</h3>
                        <p class="payment-subtitle">Visa, Mastercard, RuPay, Amex</p>
                    </label>

                    <label class="payment-option active" data-method="upi">
                        <input type="radio" name="payment" class="payment-radio" checked>
                        <div class="radio-indicator"></div>
                        <div class="payment-icon" style="background: linear-gradient(135deg, #10b981, #059669); color: white;">UPI</div>
                        <h3 class="payment-title">UPI</h3>
                        <p class="payment-subtitle">Google Pay, PhonePe, Paytm</p>
                    </label>

                    <label class="payment-option" data-method="netbanking">
                        <input type="radio" name="payment" class="payment-radio">
                        <div class="radio-indicator"></div>
                        <div class="payment-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706); color: white;">🏦</div>
                        <h3 class="payment-title">Net Banking</h3>
                        <p class="payment-subtitle">160+ Banks</p>
                    </label>

                    <label class="payment-option" data-method="wallet">
                        <input type="radio" name="payment" class="payment-radio">
                        <div class="radio-indicator"></div>
                        <div class="payment-icon" style="background: linear-gradient(135deg, #ec4899, #db2777); color: white;">💰</div>
                        <h3 class="payment-title">Wallets</h3>
                        <p class="payment-subtitle">Paytm, Mobikwik</p>
                    </label>
                </div>

                <!-- Card Form -->
                <div id="cardForm" class="form-group" style="display: none;">
                    <label class="form-label">Card Number</label>
                    <div style="position: relative;">
                        <input type="text" class=" form-input card-number" placeholder="  1234 5678 1234 5678" maxlength="19">
                        <span class="card-type" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--text-muted);">★</span>
                    </div>
                    <div class="card-row">
                        <div>
                            <label class="form-label">Expiry</label>
                            <input type="text" class="form-input" placeholder="MM/YY" maxlength="5">
                        </div>
                        <div>
                            <label class="form-label">CVV</label>
                            <input type="password" class="form-input" placeholder="123" maxlength="4">
                        </div>
                    </div>
                </div>

                <!-- UPI QR -->
                <div id="upiQr" class="upi-qr active">
                    <div class="qr-code">📱</div>
                    <div class="upi-id">7092779050@axl</div>
                    <div style="color: var(--text-muted); font-size: 14px;">Scan QR or enter UPI ID</div>
                </div>
            </div>
            <script>

const upiId = "7092779050@axl";
const name = "YourStore";
const amount = 34990;

const upiLink = `upi://pay?pa=${upiId}&pn=${name}&am=${amount}&cu=INR`;

const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiLink)}`;

document.getElementById("upiQrImg").src = qrUrl;

</script>

            <!-- Order Summary -->
            <div class="summary-card">
                <div class="summary-header">
                    <div class="section-icon">📊</div>
                    <h2 class="section-title">Order Summary</h2>
                </div>
                <div class="amount-display">₹</div>
                
                <div class="summary-item">
                    <span>Subtotal</span>
                    <span></span>
                </div>
                <div class="summary-item">
                    <span>Processing Fee</span>
                    <span>₹20</span>
                </div>
                <div class="summary-item">
                    <span>Platform Discount</span>
                    <span class="discount-tag">-₹100</span>
                </div>
                <div class="summary-item">
                    <span>Total</span>
                    <strong></strong>
                </div>

                <button class="pay-button" onclick="initiatePayment()">
                    🔒 Complete Secure Payment
                </button>
            </div>
        </div>
    </div>

    <script>
        // Professional payment validation & flow
        let selectedMethod = 'upi';
        
        document.addEventListener('change', function(e) {
            if (e.target.name === 'payment') {
                selectedMethod = e.target.closest('.payment-option').dataset.method;
                updateForms();
            }
        });

        function updateForms() {
            document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('active'));
            document.querySelector(`[data-method="${selectedMethod}"]`).classList.add('active');
            
            document.getElementById('cardForm').style.display = selectedMethod === 'card' ? 'block' : 'none';
            document.getElementById('upiQr').classList.toggle('active', selectedMethod === 'upi');
        }

        function initiatePayment() {
            const orderDetails = {
                amount: 9420,
                method: selectedMethod.toUpperCase(),
                orderId: 'ORD' + Date.now(),
                timestamp: new Date().toLocaleString('en-IN')
            };

            // YOUR WhatsApp Business Number (Replace with yours)
            const yourNumber = '7092779050'; // +91 98xxx xxx10
            const message = `🛒 *NEW ORDER*\n\n` +
                `💰 Amount: ₹${orderDetails.amount}\n` +
                `💳 Method: ${orderDetails.method}\n` +
                `🆔 Order ID: ${orderDetails.orderId}\n` +
                `📅 Time: ${orderDetails.timestamp}\n\n` +
                `Product:  Gen\n` +
                `Status: Payment Pending\n\n` +
                `*Please confirm payment received*`;

            const whatsappUrl = `https://wa.me/${yourNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
            
            // Optional: Show success animation
            document.querySelector('.pay-button').textContent = '✅ Payment Initiated!';
            setTimeout(() => {
                document.querySelector('.pay-button').textContent = '🔒 Complete Secure Payment';
            }, 2000);
        }

        // Card input formatting
        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('card-number')) {
                let value = e.target.value.replace(/\s/g, '').replace(/[^0-9]/gi, '');
                let matches = value.match(/\d{4,16}/g);
                let match = matches && matches[0] || '';
                let parts = [];
                for (let i = 0; i < match.length; i += 4) {
                    parts.push(match.substr(i, 4));
                }
                e.target.value = parts.join(' ');
            }
        });
    </script>

    
</body>
</html>
