        /* Exact same CSS - no changes */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh; padding: 2rem; 
        }
        .header { text-align: center; margin-bottom: 3rem; }
        h1 { color: #2563eb; font-size: 2.5rem; margin-bottom: 1rem; }
        .cart-toggle { 
            position: fixed; top: 2rem; right: 2rem; background: #10b981; color: white; 
            border: none; width: 60px; height: 60px; border-radius: 50%; 
            font-size: 1.5rem; cursor: pointer; box-shadow: 0 10px 30px rgba(16,185,129,0.3); 
            transition: all 0.3s; z-index: 1000; 
        }
        .cart-toggle:hover { transform: scale(1.1); }
        .cart-badge { 
            position: absolute; top: -8px; right: -8px; background: #ef4444; 
            color: white; border-radius: 50%; width: 24px; height: 24px; 
            font-size: 0.8rem; display: flex; align-items: center; justify-content: center; 
        }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; max-width: 1400px; margin: 0 auto; }
        .product-card { 
            background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            text-align: center; transition: transform 0.3s; 
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; }
        .product-name { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1f2937; }
        .product-price { font-size: 1.8rem; color: #10b981; font-weight: bold; margin-bottom: 1rem; }
        .add-btn { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; 
            padding: 1rem 2rem; border: none; border-radius: 8px; font-size: 1.1rem; 
            cursor: pointer; width: 100%; transition: transform 0.2s; 
        }
        .add-btn:hover { transform: translateY(-2px); }
        .add-btn.added { background: #10b981; }
        .cart-drawer { 
            position: fixed; top: 0; right: -500px; width: 400px; height: 100vh; 
            background: white; box-shadow: -10px 0 30px rgba(0,0,0,0.2); 
            transition: right 0.3s; z-index: 1001; overflow-y: auto; padding: 2rem; 
        }
        .cart-drawer.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .close-cart { background: none; border: none; font-size: 2rem; cursor: pointer; color: #6b7280; }
        .cart-item { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #e5e7eb; }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .cart-details { flex: 1; }
        .cart-name { font-weight: 600; margin-bottom: 0.5rem; }
        .cart-price { color: #10b981; font-weight: bold; }
        .quantity-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .qty-btn { background: #f3f4f6; border: none; width: 32px; height: 32px; border-radius: 4px; cursor: pointer; }
        .remove-btn { background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; margin-top: 0.5rem; }
        .cart-total { margin-top: 2rem; text-align: center; }
        .total-price { font-size: 2rem; color: #10b981; font-weight: bold; }
        .checkout-btn { 
            width: 100%; background: linear-gradient(135deg, #ef4444, #dc2626); 
            color: white; padding: 1rem; border: none; border-radius: 8px; 
            font-size: 1.2rem; cursor: pointer; margin-top: 1rem; 
        }
        @media (max-width: 768px) { 
            .cart-drawer { width: 100%; right: -100%; } 
            .products-grid { grid-template-columns: 1fr; } 
        }
    </style>
</head>

        // ALL JAVASCRIPT LOGIC REMAINS EXACTLY THE SAME
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        const productsGrid = document.getElementById('productsGrid');
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.img}" alt="${product.name}" class="product-img">
                <h3 class="product-name">${product.name}</h3>
                <div class="product-price">₹${product.price.toLocaleString('en-IN')}</div>
                <button class="add-btn" data-id="${product.id}">Add to Cart</button>
            `;
            productsGrid.appendChild(card);
        });

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('add-btn')) {
                const id = parseInt(e.target.dataset.id);
                const product = products.find(p => p.id === id);
                const cartItem = cart.find(item => item.id === id);
                if (cartItem) {
                    cartItem.qty += 1;
                } else {
                    cart.push({ ...product, qty: 1 });
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                e.target.textContent = 'Added!';
                e.target.classList.add('added');
                setTimeout(() => {
                    e.target.textContent = 'Add to Cart';
                    e.target.classList.remove('added');
                }, 1500);
                updateCartBadge();
                updateCartDisplay();
            }
        });

        document.getElementById('cartToggle').addEventListener('click', () => {
            document.getElementById('cartDrawer').classList.toggle('open');
        });
        document.getElementById('closeCart').addEventListener('click', () => {
            document.getElementById('cartDrawer').classList.remove('open');
        });

        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            cartItems.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <div class="cart-details">
                        <div class="cart-name">${item.name}</div>
                        <div class="cart-price">₹${item.price.toLocaleString('en-IN')} x <span class="qty">${item.qty}</span></div>
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${item.id})">Remove</button>
                    </div>
                `;
                cartItems.appendChild(div);
                total += item.price * item.qty;
            });
            document.getElementById('totalPrice').textContent = `₹${total.toLocaleString('en-IN')}`;
        }

        window.changeQty = (id, delta) => {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                updateCartBadge();
                updateCartDisplay();
            }
        };

        window.removeItem = (id) => {
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            updateCartDisplay();
        };

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.textContent = totalQty;
        }

// 👇 ADD HERE (replace old checkout)
window.checkout = () => {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    // Calculate total
    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

    // Save both cart + total
    localStorage.setItem("orderSummary", JSON.stringify(cart));
    localStorage.setItem("orderTotal", total);

    // Redirect
    window.location.href = "ordersummary.html";
};
