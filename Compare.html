<script>



let selectedProducts = [];

const grid = document.getElementById('product-grid');
const compareBtn = document.getElementById('compare-btn');

// 1. Render Product Cards
products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
        <h3>${p.name}</h3>
        <p>${p.price}</p>
        <button onclick="toggleSelect(${p.id}, this)">Select to Compare</button>
    `;
    grid.appendChild(card);
});

// 2. Handle Selection
function toggleSelect(id, btn) {
    const index = selectedProducts.indexOf(id);
    if (index > -1) {
        selectedProducts.splice(index, 1);
        btn.parentElement.classList.remove('selected');
        btn.innerText = "Select to Compare";
    } else {
        if (selectedProducts.length < 3) { // Limit to 3 for readability
            selectedProducts.push(id);
            btn.parentElement.classList.add('selected');
            btn.innerText = "Remove";
        } else {
            alert("You can only compare up to 3 products.");
        }
    }
    updateCompareBtn();
}

function updateCompareBtn() {
    compareBtn.disabled = selectedProducts.length < 2;
    compareBtn.innerText = `Compare Selected (${selectedProducts.length})`;
}

// 3. Generate Comparison Table
compareBtn.onclick = () => {
    const modal = document.getElementById('compare-modal');
    const container = document.getElementById('comparison-table-container');
    const items = products.filter(p => selectedProducts.includes(p.id));

    let html = `<table>
        <tr><th>Feature</th>${items.map(i => `<th>${i.name}</th>`).join('')}</tr>
        <tr><td>Price</td>${items.map(i => `<td>${i.price}</td>`).join('')}</tr>
        <tr><td>RAM</td>${items.map(i => `<td>${i.ram}</td>`).join('')}</tr>
        <tr><td>Battery</td>${items.map(i => `<td>${i.battery}</td>`).join('')}</tr>
    </table>`;

    container.innerHTML = html;
    modal.style.display = "block";
};

// Close Modal
document.querySelector('.close-modal').onclick = () => {
    document.getElementById('compare-modal').style.display = "none";
};

products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
        <img src="${p.img}" alt="${p.name}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px;" onerror="this.src='https://via.placeholder.com/200x150?text=No+Image'">
        <h3>${p.name}</h3>
        <p>Price: ₹${p.price.toLocaleString()}</p>
        <button onclick="toggleSelect(${p.id}, this)">Select to Compare</button>
    `;
    grid.appendChild(card);
}); 


</script>
