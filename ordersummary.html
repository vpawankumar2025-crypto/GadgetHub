<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary</title>
<link rel="icon" href="images/order summary.png">
<base target="_blank">

<style>
*{box-sizing:border-box}

body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#f8f9fa;
margin:0;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:1fr 380px;
gap:24px;
}

.left-section{
background:white;
border-radius:16px;
padding:28px;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

.header-title{
font-size:28px;
font-weight:700;
margin-bottom:20px;
}

.product-card{
display:flex;
gap:20px;
align-items:center;
padding:20px;
border:1px solid #eee;
border-radius:12px;
margin-bottom:20px;
}

.product-card img{
width:100px;
height:100px;
border-radius:10px;
object-fit:cover;
}

.product-price{
font-size:24px;
font-weight:700;
color:#00a651;
margin-top:8px;
}

.right-sidebar{
display:flex;
flex-direction:column;
gap:20px;
}

.summary-card{
background:white;
border-radius:16px;
padding:24px;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

.summary-title{
font-size:20px;
font-weight:700;
margin-bottom:15px;
}

.price-row{
display:flex;
justify-content:space-between;
font-size:18px;
margin-bottom:12px;
}

.total-price{
font-size:28px;
font-weight:800;
color:#ff6200;
}

.pay-btn{
width:100%;
background:linear-gradient(135deg,#ffc107,#ffed4e);
border:none;
padding:18px;
border-radius:12px;
font-size:20px;
font-weight:700;
cursor:pointer;
margin-top:16px;
}

.gst-toggle{
display:flex;
gap:12px;
margin-top:20px;
padding:16px;
background:#f8f9fa;
border-radius:12px;
border:2px solid #e9ecef;
cursor:pointer;
}

.gst-form{
max-height:0;
overflow:hidden;
transition:0.3s;
}

.gst-form.show{
max-height:400px;
margin-top:15px;
}

.gst-form input{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
}

@media(max-width:768px){
.container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="left-section">

<h1 class="header-title">Your Order</h1>

<div id="productContainer"></div>

<!-- GST FORM (only UI, not affecting price) -->
<label class="gst-toggle">
<input type="checkbox" id="gstCheckbox" onchange="toggleGstForm()">
<div>
<strong>GST Bill Required</strong><br>
<span style="font-size:14px;color:#666">Provide GST details</span>
</div>
</label>

<div id="gstForm" class="gst-form">
<input placeholder="GSTIN">
<input placeholder="Company Name">
<input placeholder="State">
<input placeholder="PAN">
<input placeholder="Billing Address">
</div>

</div>

<!-- RIGHT -->
<div class="right-sidebar">

<div class="summary-card">

<h3 class="summary-title">Order Summary</h3>

<div class="price-row">
<span>Price</span>
<span id="basePrice">₹0</span>
</div>

<div class="price-row">
<span>GST (18%)</span>
<span id="gstPrice">₹0</span>
</div>

<div class="price-row">
<span>Total</span>
<span class="total-price" id="totalPrice">₹0</span>
</div>

<a href="payment.html">
<button class="pay-btn">Pay Securely</button>
</a>

</div>

</div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

    const selectedProduct = JSON.parse(localStorage.getItem("selectedProduct"));

    // ❌ No product case
    if(!selectedProduct){
        document.getElementById("productContainer").innerHTML =
        "<h2>No product selected ❌</h2>";
        return;
    }

    const price = selectedProduct.price;

    // ✅ GST ALWAYS INCLUDED
    const gst = price * 0.18;
    const total = price + gst;

    // ✅ SHOW PRODUCT
    document.getElementById("productContainer").innerHTML = `
        <div class="product-card">
            <img src="${selectedProduct.img}">
            <div>
                <h3>${selectedProduct.name}</h3>
                <div class="product-price">₹${price.toLocaleString()}</div>
            </div>
        </div>
    `;

    // ✅ UPDATE PRICES
    document.getElementById("basePrice").innerText = "₹" + price.toLocaleString();
    document.getElementById("gstPrice").innerText = "₹" + gst.toLocaleString();
    document.getElementById("totalPrice").innerText = "₹" + total.toLocaleString();

});

// ✅ GST FORM TOGGLE (UI ONLY)
function toggleGstForm(){
    const gstForm = document.getElementById("gstForm");
    const checkbox = document.getElementById("gstCheckbox");

    if(checkbox.checked){
        gstForm.classList.add("show");
    } else {
        gstForm.classList.remove("show");
    }
}

</script>

</body>
</html>
