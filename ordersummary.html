<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Summary</title>
<link rel="icon" href="images/order summary.avif">
<base target="_blank">

<style>

*{box-sizing:border-box}

body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#f8f9fa;
margin:0;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:1fr 380px;
gap:24px;
}

.left-section{
background:white;
border-radius:16px;
padding:28px;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

.page-header{
display:flex;
align-items:center;
gap:16px;
margin-bottom:32px;
padding-bottom:20px;
border-bottom:1px solid #e9ecef;
}

.header-badge{
background:#f0f8ff;
color:#007bff;
padding:6px 12px;
border-radius:20px;
font-size:14px;
font-weight:600;
}

.header-title{
font-size:28px;
font-weight:700;
margin:0;
}

.product-card{
display:flex;
gap:20px;
align-items:center;
padding:20px;
border:1px solid #eee;
border-radius:12px;
margin-bottom:20px;
}

.product-card img{
width:100px;
height:100px;
border-radius:10px;
object-fit:cover;
}

.product-info h3{
margin:0;
font-size:20px;
}

.product-price{
font-size:24px;
font-weight:700;
color:#00a651;
margin-top:8px;
}

.right-sidebar{
display:flex;
flex-direction:column;
gap:20px;
}

.summary-card{
background:white;
border-radius:16px;
padding:24px;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
}

.summary-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.summary-title{
font-size:20px;
font-weight:700;
}

.price-row{
display:flex;
justify-content:space-between;
font-size:18px;
margin-bottom:12px;
}

.total-price{
font-size:28px;
font-weight:800;
color:#ff6200;
}

.pay-btn{
width:100%;
background:linear-gradient(135deg,#ffc107,#ffed4e);
border:none;
padding:18px;
border-radius:12px;
font-size:20px;
font-weight:700;
cursor:pointer;
margin-top:16px;
}

.gst-toggle{
display:flex;
gap:12px;
margin-top:20px;
padding:16px;
background:#f8f9fa;
border-radius:12px;
border:2px solid #e9ecef;
cursor:pointer;
}

.gst-form{
max-height:0;
overflow:hidden;
transition:0.3s;
}

.gst-form.show{
max-height:400px;
margin-top:15px;
}

.gst-form input{
width:100%;
padding:12px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:8px;
}

@media(max-width:768px){
.container{grid-template-columns:1fr}
}

</style>
</head>

<body>

<div class="container">

<div class="left-section">

<div class="page-header">
<div class="header-badge">ORDER</div>
<h1 class="header-title">Your Order</h1>
</div>

<script>

const products = [
 { id: 1, name: 'Samsung Galaxy S25 Ultra', price: 129999, img: 'img/1.jpg' },
 { id: 2, name: 'Motorola Edge 70 5G', price: 29999, img: 'img/2.jpg' },
 // more products...
];

function buyNow(productId){

const product = products.find(p => p.id === productId)

localStorage.setItem("selectedProduct", JSON.stringify(product))

window.location.href="order-summary.html"

}

</script>

<div id="productContainer"></div>

<label class="gst-toggle">
<input type="checkbox" id="gstCheckbox" onchange="toggleGstForm()">
<div>
<strong>GST Bill Required</strong><br>
<span style="font-size:14px;color:#666">Provide GST details for tax invoice</span>
</div>
</label>

<div id="gstForm" class="gst-form">

<input placeholder="GSTIN">
<input placeholder="Company Name">
<input placeholder="State">
<input placeholder="PAN">
<input placeholder="Billing Address">

</div>

</div>

<div class="right-sidebar">

<div class="summary-card">

<div class="summary-header">
<h3 class="summary-title">Order Summary</h3>
</div>

<div class="price-row">
<span>Price</span>
<span id="basePrice">₹0</span>
</div>

<div class="price-row">
<span>GST (18%)</span>
<span id="gstPrice">₹0</span>
</div>

<div class="price-row">
<span>Total</span>
<span class="total-price" id="totalPrice">₹0</span>
</div>

<a href="payment.html" target="_blank">
<button class="pay-btn">Pay Securely</button>
</a>

</div>

</div>

</div>

<script>
function toggleGstForm() {
  const gstForm = document.getElementById("gstForm");
  const checkbox = document.getElementById("gstCheckbox");
  gstForm.classList.toggle("show", checkbox.checked);
}

// Wait for DOM ready
document.addEventListener('DOMContentLoaded', function() {
  const productData = localStorage.getItem("selectedProduct");
  console.log("Product data:", productData); // Debug log
  
  if (productData) {
    try {
      const selectedProduct = JSON.parse(productData);
      
      if (selectedProduct && selectedProduct.price) {
        const price = selectedProduct.price;
        const gst = Math.round(price * 0.18); // Round for clean ₹
        const total = price + gst;
        
        // Populate product card
        document.getElementById("productContainer").innerHTML = `
          <div class="product-card">
            <img src="${selectedProduct.img || 'placeholder.jpg'}" alt="${selectedProduct.name}" 
                 onerror="this.src='https://via.placeholder.com/100'">
            <div class="product-info">
              <h3>${selectedProduct.name}</h3>
              <div class="product-price">₹${price.toLocaleString()}</div>
            </div>
          </div>
        `;
        
        // Update prices
        document.getElementById("basePrice").textContent = `₹${price.toLocaleString()}`;
        document.getElementById("gstPrice").textContent = `₹${gst.toLocaleString()}`;
        document.getElementById("totalPrice").textContent = `₹${total.toLocaleString()}`;
        
      } else {
        showNoProduct();
      }
    } catch (e) {
      console.error("Invalid product data:", e);
      showNoProduct();
    }
  } else {
    showNoProduct();
  }
});

function showNoProduct() {
  document.getElementById("productContainer").innerHTML = 
    '<p style="color:#666; padding:20px;">No product selected. <a href="index.html">← Continue shopping</a></p>';
}
</script>

</body>
</html>
