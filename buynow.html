<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>
<link rel="icon" href="images/checkout.png">
<base target="_blank">


<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    margin: 0;
    padding: 16px;
    display: flex;
    justify-content: center;
}

.checkout-container {
    background: white;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

h1 { margin-bottom: 20px; }

.form-group { margin-bottom: 16px; }

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input, select {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.phone-row {
    display: flex;
    gap: 10px;
}

.checkbox-row {
    margin: 15px 0;
}

.btn {
    padding: 12px;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    width: 100%;
    margin-top: 10px;
    font-weight: bold;
}

.btn-home { background: #ddd; }
.btn-save { background: orange; color: white; }

#productBox {
    border: 1px solid #eee;
    padding: 10px;
    margin-bottom: 20px;
    text-align: center;
}

#productBox img {
    width: 100%;
    max-width: 200px;
}
</style>
</head>

<body>

<div class="checkout-container">

<h1>Checkout</h1>

<!-- PRODUCT -->
<div id="productBox">
    <img id="productImg">
    <h4 id="productName"></h4>
    <h4 id="productPrice"></h4>
</div>

<form id="checkoutForm">

<div class="form-group">
<label>Full Name</label>
<input type="text" id="name" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<div class="phone-row">
<input type="text" value="+91" readonly>
<input type="tel" id="phone" maxlength="10" required>
</div>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" id="dob">
</div>

<div class="form-group">
<label>City</label>
<select id="city" required>
<option value="">Select</option>
<option>Chennai</option>
<option>Mumbai</option>
<option>Bengaluru</option>
<option>Delhi</option>
</select>
</div>

<div class="form-group">
<label>Address</label>
<input type="text" id="address" required>
</div>

<div class="checkbox-row">
<input type="checkbox" id="save">
<label for="save">Save address</label>
</div>

<button type="button" class="btn btn-home" onclick="goHome()">Home</button>
<button type="submit" class="btn btn-save">Save Address</button>

</form>

<div id="debugInfo" style="font-size:12px;color:gray;"></div>

</div>

        // ✅ Correct key

    } else {
        document.getElementById("productBox").innerHTML = "<h3>No product found ❌</h3>";
    }

// SAVE FORM
document.getElementById("checkoutForm").addEventListener("submit", function(e){
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        city: document.getElementById("city").value,
        address: document.getElementById("address").value
    };

    localStorage.setItem("address", JSON.stringify(data));

    alert("Address Saved ✅");

    window.location.href = "ordersummary.html";
});
